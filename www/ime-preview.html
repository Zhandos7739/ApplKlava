<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>IME mock</title>
<style>
  body{margin:0;background:#111;display:flex;justify-content:center;padding:20px;font-family:Segoe UI,sans-serif}
  .phone{width:360px;background:#071018;border-radius:24px;overflow:hidden;border:1px solid #234}
  .app{padding:16px;color:#e8f1ff;min-height:220px}
  .app h1{margin:0;font-size:22px}
  .app p{color:#8aa0bd;font-size:13px}
  .field{margin-top:12px;background:#0f1b2d;border:1px solid #2a3f5c;border-radius:12px;padding:12px;min-height:64px;color:#e8f1ff}
  .kb{background:#0b1420;padding:8px 6px 10px}
  .row{display:flex;gap:4px;margin:4px 0}
  .k{flex:1;background:#1a2a42;color:#e8f1ff;border-radius:8px;text-align:center;padding:12px 0;font-weight:700;font-size:15px}
  .sp{flex:4.5}
  .sp2{flex:1.7;color:#8aa0bd;font-size:12px}
  .spec{color:#8aa0bd;font-size:12px}
  .banner{background:#16253b;color:#3dd6c6;padding:8px 12px;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="phone">
  <div class="banner">Системная клавиатура ApplKlava · кнопка «Обыч.» = назад</div>
  <div class="app">
    <h1>Сообщения</h1>
    <p>Любое поле ввода на телефоне</p>
    <div class="field">привет как дела|</div>
  </div>
  <div class="kb">
    <div class="row"><div class="k">й</div><div class="k">ц</div><div class="k">у</div><div class="k">к</div><div class="k">е</div><div class="k">н</div><div class="k">г</div><div class="k">ш</div><div class="k">щ</div><div class="k">з</div><div class="k">х</div></div>
    <div class="row"><div class="k">ф</div><div class="k">ы</div><div class="k">в</div><div class="k">а</div><div class="k">п</div><div class="k">р</div><div class="k">о</div><div class="k">л</div><div class="k">д</div><div class="k">ж</div><div class="k">э</div></div>
    <div class="row"><div class="k spec">⇧</div><div class="k">я</div><div class="k">ч</div><div class="k">с</div><div class="k">м</div><div class="k">и</div><div class="k">т</div><div class="k">ь</div><div class="k">б</div><div class="k">ю</div><div class="k spec">⌫</div></div>
    <div class="row"><div class="k sp2">Обыч.</div><div class="k spec">,</div><div class="k sp">пробел</div><div class="k spec">.</div><div class="k spec">↵</div></div>
  </div>
</div>
</body>
</html>
