<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>123+symbols</title>
<style>
body{margin:0;background:#111;display:flex;justify-content:center;padding:16px;font-family:Segoe UI,sans-serif}
.phone{width:360px;background:#071018;border-radius:20px;overflow:hidden;border:1px solid #234}
.banner{background:#16253b;color:#3dd6c6;padding:7px 10px;font-size:11px;text-align:center}
.kb{background:#0b1420;padding:6px 4px 8px}
.sug{display:flex;gap:4px;padding:2px 0 4px}
.chip{background:#16253b;color:#e8f1ff;border-radius:8px;text-align:center;padding:8px 0;font-size:12px;font-weight:700}
.sys{flex:0 0 72px;color:#3dd6c6}
.row{display:flex;gap:3px;margin:3px 0}
.k{flex:1;background:#1a2a42;color:#e8f1ff;border-radius:7px;text-align:center;padding:10px 0;font-weight:700;font-size:13px}
.sp{flex:4.5;font-size:11px;color:#8aa0bd}.sp2{flex:1.5;color:#8aa0bd;font-size:11px}.spec{color:#8aa0bd;font-size:11px}
</style></head><body>
<div class="phone">
<div class="banner">Экран 123: цифры + символы сразу</div>
<div class="kb">
<div class="sug"><div class="chip sys" style="width:72px">Обыч.</div></div>
<div class="row"><div class="k">1</div><div class="k">2</div><div class="k">3</div><div class="k">4</div><div class="k">5</div><div class="k">6</div><div class="k">7</div><div class="k">8</div><div class="k">9</div><div class="k">0</div></div>
<div class="row"><div class="k">-</div><div class="k">/</div><div class="k">:</div><div class="k">;</div><div class="k">(</div><div class="k">)</div><div class="k">$</div><div class="k">&amp;</div><div class="k">@</div><div class="k">"</div></div>
<div class="row"><div class="k sp2">#+ =</div><div class="k">.</div><div class="k">,</div><div class="k">?</div><div class="k">!</div><div class="k">'</div><div class="k">#</div><div class="k">%</div><div class="k">*</div><div class="k spec">⌫</div></div>
<div class="row"><div class="k sp2">ABC</div><div class="k">+</div><div class="k sp">пробел</div><div class="k">=</div><div class="k spec">↵</div></div>
</div></div></body></html>
